<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fixture: Contact form</title>
<style>body{font:16px system-ui;max-width:480px;margin:40px auto}label{display:block;margin:12px 0 4px}input,textarea{width:100%;padding:6px;box-sizing:border-box}</style></head>
<body>
<h1>Contact us</h1>
<form id="contact-form" onsubmit="event.preventDefault();document.getElementById('result').textContent='SUBMITTED';">
  <label for="full-name">Full name</label><input id="full-name" name="name" autocomplete="name">
  <label for="email">Email</label><input id="email" name="email" type="email">
  <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
  <label for="school">School</label><input id="school" name="school">
  <label for="message">Message</label><textarea id="message" name="message" rows="4"></textarea>
  <p><button type="submit">Send message</button></p>
</form>
<p id="result" aria-live="polite"></p>
</body></html>
