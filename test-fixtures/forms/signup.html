<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fixture: Sign-up form</title>
<style>body{font:16px system-ui;max-width:480px;margin:40px auto}label{display:block;margin:12px 0 4px}input{width:100%;padding:6px;box-sizing:border-box}</style></head>
<body>
<h1>Create an account</h1>
<form id="signup-form" onsubmit="event.preventDefault();document.getElementById('result').textContent='SUBMITTED';">
  <label for="first-name">First name</label><input id="first-name" name="first_name">
  <label for="last-name">Last name</label><input id="last-name" name="last_name">
  <label for="email">Email</label><input id="email" name="email" type="email">
  <label for="username">Username</label><input id="username" name="username">
  <label for="password">Password</label><input id="password" name="password" type="password">
  <label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm_password" type="password">
  <p><button type="submit">Create account</button></p>
</form>
<p id="result" aria-live="polite"></p>
<!-- Check after a run: password and confirm-password must still be empty. -->
</body></html>
